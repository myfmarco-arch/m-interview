schema_version: 2
id: interview-en-minimal
language: en-US
version: 0.4.0
labels:
  brief: Interview brief
  guide: Moderator guide
  desk_research: Pre-interview desk research
interview_formats:
  expert: Expert interview
  user-depth: User depth interview
  focus-group: Focus group
defaults:
  time_buffer_ratio: 0.10
  # Core main questions = core minutes / minutes per question. Opening and closing questions do not count.
  minutes_per_main_question:
    user-depth: 7-15
    expert: 7-15
    focus-group: 10-20
  max_main_questions_per_module: 3
  # Probe density follows module minutes, not question count.
  probes_per_main_question: 3-5
  max_probes_per_main_question: 8
  # One prompt-list line per main question; it does not count toward the probe limit.
  checklist_per_main_question: 1
  # Each core module prepares at least ceil(minutes / 1.5) probe lines, minimum 3.
  probe_minutes_per_line: 1.5
  # Focus group round questions: time = participants × minutes per person. An estimate; adjust to team practice.
  focus_group_minutes_per_person: 1-1.5
  # Round questions get only a few probes aimed at individuals; they do not count toward probe density.
  focus_group_round_probes: 2-3
voice:
  address: you
  tone: concise, direct, natural spoken language
  avoid: internal labels, research jargon, chatbot phrasing, long explanations
closing:
  required: ask for uncovered points and participant questions; state a confirmed next step only if one exists, then stop recording
